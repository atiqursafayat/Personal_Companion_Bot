<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Companion Bot — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #080b14;
      --surface:     #0f1320;
      --glass:       rgba(255,255,255,0.04);
      --glass-hover: rgba(255,255,255,0.07);
      --border:      rgba(255,255,255,0.08);
      --accent:      #6c63ff;
      --accent-glow: rgba(108,99,255,0.25);
      --teal:        #00d4aa;
      --amber:       #ffb800;
      --red:         #ff4757;
      --text:        #e4e6f0;
      --muted:       #6b7280;
      --radius:      14px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Layout ─────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-rows: 56px 1fr auto;
      min-height: 100vh;
      padding: 0 20px 20px;
      gap: 16px;
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #9d8bff);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 17px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--glass);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      transition: color 0.3s, border-color 0.3s;
    }

    .status-pill.online { color: var(--teal); border-color: rgba(0,212,170,0.3); }
    .status-pill.offline { color: var(--red); border-color: rgba(255,71,87,0.25); }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-pill.online .status-dot { animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── Main grid ──────────────────────────────────── */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
    }

    /* Camera spans both rows on the left */
    .camera-card { grid-row: 1 / 3; }

    /* ── Cards ──────────────────────────────────────── */
    .card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      backdrop-filter: blur(12px);
      transition: border-color 0.2s;
    }

    .card:hover { border-color: rgba(255,255,255,0.14); }

    .card-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Camera feed ────────────────────────────────── */
    .camera-card {
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      position: relative;
    }

    .camera-header {
      padding: 14px 18px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .camera-feed-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 0 0 var(--radius) var(--radius);
      overflow: hidden;
      min-height: 240px;
      position: relative;
    }

    #camera-feed {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .feed-offline {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--muted);
    }

    .feed-offline.visible { display: flex; }

    .feed-icon { font-size: 40px; }

    /* ── Mood card ──────────────────────────────────── */
    .mood-emoji {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 8px;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    .mood-label {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      transition: color 0.4s;
    }

    .mood-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .confidence-bar-wrap {
      height: 5px;
      background: rgba(255,255,255,0.07);
      border-radius: 3px;
      overflow: hidden;
    }

    .confidence-bar {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent), var(--teal));
      transition: width 0.6s ease;
      width: 0%;
    }

    .confidence-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
      text-align: right;
    }

    /* ── System status ──────────────────────────────── */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .stat-icon { font-size: 18px; margin-bottom: 4px; }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .stat-key {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    /* ── Reminders ──────────────────────────────────── */
    .reminders-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .reminder-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .reminder-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .reminder-msg { flex: 1; font-size: 12px; font-weight: 500; }
    .reminder-time { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .no-items { color: var(--muted); font-size: 12px; text-align: center; padding: 16px 0; }

    /* ── Captures row ───────────────────────────────── */
    .captures-row {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .captures-grid {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      padding-bottom: 4px;
    }

    .capture-thumb {
      flex-shrink: 0;
      width: 90px; height: 70px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }

    .capture-thumb:hover {
      transform: scale(1.04);
      border-color: var(--accent);
    }

    .capture-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .capture-badge {
      position: absolute;
      bottom: 3px; right: 4px;
      font-size: 9px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* ── Lightbox ───────────────────────────────────── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }

    .lightbox-close {
      position: absolute;
      top: 20px; right: 24px;
      background: none; border: none;
      color: #fff; font-size: 28px;
      cursor: pointer; line-height: 1;
    }

    /* ── Responsive ─────────────────────────────────── */
    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }
      .camera-card { grid-row: auto; }
      .app { padding: 0 12px 16px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">🤖</div>
      Personal Companion
    </div>
    <div class="status-pill offline" id="status-pill">
      <div class="status-dot"></div>
      <span id="status-text">Connecting…</span>
    </div>
  </header>

  <!-- Main grid -->
  <div class="main-grid">

    <!-- Camera feed -->
    <div class="card camera-card">
      <div class="camera-header">
        <span class="card-title" style="margin:0">Live Camera</span>
        <span style="font-size:11px;color:var(--muted)" id="fps-hint">MJPEG · 15 fps</span>
      </div>
      <div class="camera-feed-wrap">
        <img id="camera-feed" src="/feed" alt="Camera feed"
             onerror="showFeedOffline()" onload="hideFeedOffline()" />
        <div class="feed-offline" id="feed-offline">
          <div class="feed-icon">📷</div>
          <span>Camera offline</span>
        </div>
      </div>
    </div>

    <!-- Mood card -->
    <div class="card" id="mood-card">
      <div class="card-title">Current Mood</div>
      <div class="mood-emoji" id="mood-emoji">😶</div>
      <div class="mood-label" id="mood-label">Waiting…</div>
      <div class="mood-sub" id="mood-sub">Vision process not detected</div>
      <div class="confidence-bar-wrap">
        <div class="confidence-bar" id="confidence-bar"></div>
      </div>
      <div class="confidence-label" id="confidence-label">—</div>
    </div>

    <!-- System status -->
    <div class="card">
      <div class="card-title">System Status</div>
      <div class="stat-grid">
        <div class="stat-item">
          <div class="stat-icon">🔋</div>
          <div class="stat-value" id="stat-battery">—</div>
          <div class="stat-key">Battery</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">🌡️</div>
          <div class="stat-value" id="stat-temp">—</div>
          <div class="stat-key">CPU Temp</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">💾</div>
          <div class="stat-value" id="stat-disk">—</div>
          <div class="stat-key">Disk Used</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">📶</div>
          <div class="stat-value" id="stat-wifi" style="font-size:13px">—</div>
          <div class="stat-key">Wi-Fi</div>
        </div>
      </div>
    </div>

    <!-- Reminders -->
    <div class="card">
      <div class="card-title">Upcoming Reminders</div>
      <div class="reminders-list" id="reminders-list">
        <div class="no-items">No pending reminders</div>
      </div>
    </div>

  </div>

  <!-- Captures row -->
  <div class="captures-row">
    <div class="card-title" style="margin-bottom:12px">Recent Captures</div>
    <div class="captures-grid" id="captures-grid">
      <div class="no-items">No captures yet</div>
    </div>
  </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="Full capture" />
</div>

<script>
  // ── Mood emoji map ──────────────────────────────────────────
  const MOOD_EMOJI = {
    HAPPY:     '😊', SAD:       '😢', ANGRY:    '😠',
    DISGUSTED: '🤢', FEARFUL:   '😨', SURPRISED:'😲',
    NEUTRAL:   '😐',
  };

  const MOOD_COLOR = {
    HAPPY:     '#00d4aa', SAD:      '#6c63ff', ANGRY:    '#ff4757',
    DISGUSTED: '#ff6b35', FEARFUL:  '#ffb800', SURPRISED:'#a29bfe',
    NEUTRAL:   '#6b7280',
  };

  // ── Camera error handling ───────────────────────────────────
  function showFeedOffline() {
    document.getElementById('camera-feed').style.display = 'none';
    document.getElementById('feed-offline').classList.add('visible');
  }
  function hideFeedOffline() {
    document.getElementById('camera-feed').style.display = 'block';
    document.getElementById('feed-offline').classList.remove('visible');
  }

  // ── Helpers ─────────────────────────────────────────────────
  function fmtTime(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function capitalize(s) {
    return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : '';
  }

  // ── Update mood ─────────────────────────────────────────────
  function updateMood(data) {
    const { mood, confidence, age_seconds, online } = data;
    const pill = document.getElementById('status-pill');
    const pillText = document.getElementById('status-text');

    if (online) {
      pill.className = 'status-pill online';
      pillText.textContent = 'Vision Online';
    } else {
      pill.className = 'status-pill offline';
      pillText.textContent = 'Vision Offline';
    }

    if (!mood) return;

    const emoji = MOOD_EMOJI[mood] || '🤔';
    const color = MOOD_COLOR[mood] || '#6b7280';
    const pct   = confidence != null ? Math.round(confidence) : null;

    document.getElementById('mood-emoji').textContent = emoji;
    document.getElementById('mood-emoji').style.transform = 'scale(1.15)';
    setTimeout(() => {
      document.getElementById('mood-emoji').style.transform = 'scale(1)';
    }, 350);

    const labelEl = document.getElementById('mood-label');
    labelEl.textContent = capitalize(mood);
    labelEl.style.color = color;

    document.getElementById('mood-sub').textContent =
      age_seconds != null ? `Updated ${age_seconds.toFixed(0)}s ago` : '';

    if (pct != null) {
      document.getElementById('confidence-bar').style.width = pct + '%';
      document.getElementById('confidence-label').textContent = pct + '% confidence';
    }
  }

  // ── Update system stats ─────────────────────────────────────
  function updateSystem(sys) {
    if (!sys) return;

    const battEl = document.getElementById('stat-battery');
    if (sys.battery_percent != null) {
      const icon = sys.battery_status === 'charging' ? '⚡' : '';
      battEl.textContent = sys.battery_percent + '% ' + icon;
      battEl.style.color = sys.battery_percent < 20 ? 'var(--red)' :
                           sys.battery_percent < 50 ? 'var(--amber)' : '';
    } else {
      battEl.textContent = 'N/A';
    }

    const tempEl = document.getElementById('stat-temp');
    if (sys.cpu_temp_celsius != null) {
      tempEl.textContent = sys.cpu_temp_celsius.toFixed(1) + '°C';
      tempEl.style.color = sys.cpu_temp_celsius > 80 ? 'var(--red)' :
                           sys.cpu_temp_celsius > 65 ? 'var(--amber)' : '';
    } else {
      tempEl.textContent = 'N/A';
    }

    const diskEl = document.getElementById('stat-disk');
    if (sys.disk_used_percent != null) {
      diskEl.textContent = sys.disk_used_percent + '%';
      diskEl.style.color = sys.disk_used_percent > 90 ? 'var(--red)' :
                           sys.disk_used_percent > 75 ? 'var(--amber)' : '';
    } else {
      diskEl.textContent = 'N/A';
    }

    const wifiEl = document.getElementById('stat-wifi');
    if (sys.wifi_enabled === false) {
      wifiEl.textContent = 'Off';
      wifiEl.style.color = 'var(--muted)';
    } else if (sys.wifi_ssid) {
      wifiEl.textContent = sys.wifi_ssid;
      wifiEl.style.color = 'var(--teal)';
    } else if (sys.wifi_enabled) {
      wifiEl.textContent = 'On';
      wifiEl.style.color = '';
    } else {
      wifiEl.textContent = 'N/A';
    }
  }

  // ── Update reminders ────────────────────────────────────────
  function updateReminders(items) {
    const container = document.getElementById('reminders-list');
    if (!items || items.length === 0) {
      container.innerHTML = '<div class="no-items">No pending reminders</div>';
      return;
    }
    container.innerHTML = items.map(r => {
      const color = r.kind === 'timer' ? 'var(--teal)' : 'var(--accent)';
      return `
        <div class="reminder-item">
          <div class="reminder-dot" style="background:${color}"></div>
          <span class="reminder-msg">${r.message}</span>
          <span class="reminder-time">${fmtTime(r.due_at)}</span>
        </div>`;
    }).join('');
  }

  // ── Update captures ─────────────────────────────────────────
  let lastCaptureCount = -1;

  async function refreshCaptures() {
    try {
      const res = await fetch('/api/captures');
      const items = await res.json();
      const container = document.getElementById('captures-grid');
      if (items.length === 0) {
        container.innerHTML = '<div class="no-items">No captures yet</div>';
        return;
      }
      container.innerHTML = items.map(f => {
        const ts = new Date(f.captured_at * 1000).toLocaleDateString();
        return `
          <div class="capture-thumb" onclick="openLightbox('/captures/${f.name}')">
            <img src="/captures/${f.name}" alt="${f.name}" loading="lazy" />
            <span class="capture-badge">${ts}</span>
          </div>`;
      }).join('');
    } catch (_) {}
  }

  // ── Lightbox ─────────────────────────────────────────────────
  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }
  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });

  // ── SSE connection ───────────────────────────────────────────
  function connectSSE() {
    const es = new EventSource('/events');

    es.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        updateMood(data.mood);
        updateSystem(data.system);
        updateReminders(data.reminders);

        // Only re-fetch captures when the count changes
        if (data.captures_count !== lastCaptureCount) {
          lastCaptureCount = data.captures_count;
          refreshCaptures();
        }
      } catch (_) {}
    };

    es.onerror = () => {
      document.getElementById('status-pill').className = 'status-pill offline';
      document.getElementById('status-text').textContent = 'Disconnected';
      es.close();
      // Reconnect after 4 seconds
      setTimeout(connectSSE, 4000);
    };
  }

  // ── Boot ────────────────────────────────────────────────────
  connectSSE();
  refreshCaptures();
</script>
</body>
</html>
